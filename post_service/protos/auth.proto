syntax = "proto3";

package auth;

option go_package = "post_service/pkg/grpc/pb";

service AuthService {
  rpc VerifyToken (VerifyTokenRequest) returns (VerifyTokenResponse) {}
}

message VerifyTokenRequest {
  string token = 1;
}

message VerifyTokenResponse {
  bool is_valid = 1;
  int64 user_id = 2;
}
